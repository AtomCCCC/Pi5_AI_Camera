# GPIO Service Configuration

mqtt:
  broker: "localhost"
  port: 1883
  topic_command: "gpio/command"
  topic_control_command: "control/command"

arbitration:
  # A manual/LLM single-servo command temporarily owns the gimbal. The GPIO
  # service ignores visual PID commands during this interval and tells the
  # control service to reseed its internal angle before tracking resumes.
  manual_override_seconds: 3.0

pwm:
  # This is the controller name, not a channel number. On some Pi 5 images the
  # RP1 controller appears as pwmchip2; confirm with: ls /sys/class/pwm
  chip: "/sys/class/pwm/pwmchip0"
  lock_file: "/tmp/pi5_ai_camera_pwm.lock"
  gpio_to_channel:
    12: 0
    13: 1

servo:
  servo1:
    pin: 13          # Pan: BCM GPIO 13 (physical pin 33), PWM channel 1
    min_pulse: 900   # FS90 conservative starting range, microseconds
    max_pulse: 2100
    pulse_min_angle: 0
    pulse_max_angle: 180
    freq: 50
    min_angle: 20    # Calibrate for the actual gimbal linkage.
    max_angle: 160
    center_angle: 90
  servo2:
    pin: 12          # Tilt: BCM GPIO 12 (physical pin 32), PWM channel 0
    min_pulse: 900
    max_pulse: 2100
    pulse_min_angle: 0
    pulse_max_angle: 180
    freq: 50
    min_angle: 20
    max_angle: 160
    center_angle: 90

screen:
  type: "oled"      # "oled" | "tft" | "hdmi" | "lcd"
  i2c_addr: 0x3C    # For SSD1306 OLED
  width: 128
  height: 64
  font_size: 10
