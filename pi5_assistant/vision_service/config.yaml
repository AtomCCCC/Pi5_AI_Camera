# Vision Service Configuration
# ───────────────────────────

camera:
  sensor: "imx708"            # Camera Module 3 sensor
  base_resolution: [640, 640] # YOLO input dimensions (width, height)
  base_framerate: 30
  flip_horizontal: false
  flip_vertical: false

  # Dynamic FPS/resolution adjustment
  # Camera Module 3 supports multi-resolution streaming.
  # YOLO on Hailo-10H handles up to 430+ FPS @ 640×640,
  # so we adjust camera capture resolution & framerate by motion:
  #   High motion → 640×320 @ 60fps (wider FOV, faster capture)
  #   Low motion  → 640×640 @ 30fps (full quality, stable)
  dynamic_adjust:
    enabled: true
    check_interval: 0.5        # seconds between motion checks
    motion_threshold: 30       # mean pixel diff to trigger "high motion"
    motion_window: 5           # frames to average for smoothing
    profiles:
      low_motion:
        resolution: [640, 640]
        framerate: 30
        label: "full quality"
      high_motion:
        resolution: [640, 320]
        framerate: 60
        label: "fast capture"

detection:
  backend: "hailo"            # "hailo" | "ncnn" | "opencv"
  model: "yolov8n"            # yolov8n / yolov8s / yolov8m
  confidence: 0.5
  iou_threshold: 0.45
  classes: []                 # Empty = all classes

vlm:
  mode: "hailo"               # "hailo" (Path A) or "qwen-cpu" (Path B)
  # Path A: Hailo
  hailo_app: "hailo_apps.python.gen_ai_apps.vlm_chat.vlm_chat"
  hailo_input: "rpi"          # "rpi" or "usb"
  # Path B: Qwen2.5-VL
  qwen_model: "qwen2.5vl:3b"
  qwen_timeout: 30

shared_buffer:
  max_age_ms: 1000            # Detections older than this are stale

mqtt:
  broker: "localhost"
  port: 1883
  topic_query: "vision/query"
  topic_result: "vision/result"
