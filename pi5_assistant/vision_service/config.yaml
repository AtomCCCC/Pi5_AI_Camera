# Vision Service Configuration
# ───────────────────────────

camera:
  sensor: "imx708"            # Camera Module 3 sensor
  base_resolution: [640, 640] # YOLO input dimensions (width, height)
  base_framerate: 30
  flip_horizontal: false
  flip_vertical: false

  # Dynamic FPS/resolution adjustment
  # Camera Module 3 native modes are used to trade resolution vs framerate.
  # The KAN outputs a continuous alpha; a hysteresis band (0.4-0.6) selects
  # the profile to avoid flapping near the boundary:
  #   High motion → 1536×864  @ 120fps (FPS-priority, fast capture)
  #   Low motion  → 2304×1296 @ 56fps  (RES-priority, full detail)
  dynamic_adjust:
    enabled: true
    check_interval: 0.5        # seconds between KAN decisions
    motion_threshold: 30       # fallback if KAN is unavailable
    motion_window: 5           # frames to average for smoothing
    profiles:
      low_motion:
        resolution: [2304, 1296]
        framerate: 56
        label: "RES-priority"
      high_motion:
        resolution: [1536, 864]
        framerate: 120
        label: "FPS-priority"

detection:
  backend: "hailo"            # "hailo" | "ncnn" | "opencv"
  model: "yolov8n"            # yolov8n / yolov8s / yolov8m
  hef_path: "/usr/local/hailo/resources/models/hailo10h/hailo_yolov8n_4_classes_vga.hef"
  input_color_order: "rgb"     # OpenCV capture is BGR; this HEF expects RGB
  labels: ["person", "bicycle", "car", "motorcycle"]
  confidence: 0.5
  iou_threshold: 0.45
  classes: []                 # Empty = all classes

# Dynamic ROI crops follow the highest-confidence detections.
# Set max_regions to 1 when only one ROI image is required.
roi:
  enabled: true
  max_regions: 1             # Increase for multiple simultaneous ROI images
  padding_ratio: 0.08         # Extra border around each detection
  max_dimension: 320          # Downscale crops to control MQTT payload size
  jpeg_quality: 80
  publish_interval: 0.2       # seconds (5 ROI updates per second)

vlm:
  mode: "hailo"               # "hailo" (Path A) or "qwen-cpu" (Path B)
  # Path A: Hailo
  hailo_app: "hailo_apps.python.gen_ai_apps.vlm_chat.vlm_chat"
  hailo_input: "rpi"          # "rpi" or "usb"
  # Path B: Qwen2.5-VL
  qwen_model: "qwen2.5vl:3b"
  qwen_timeout: 30

shared_buffer:
  max_age_ms: 1000            # Detections older than this are stale

mqtt:
  broker: "localhost"
  port: 1883
  topic_query: "vision/query"
  topic_result: "vision/result"
  topic_detect: "vision/detect"
  topic_detect_result: "vision/detect_result"
  topic_detections: "vision/detections"
  topic_frame: "vision/frame"
  topic_roi: "vision/roi"
  topic_fps_status: "vision/fps/status"
  frame_publish_interval: 0.2
